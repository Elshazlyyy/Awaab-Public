name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to main.
#
# Why this workflow exists explicitly (instead of the auto-generated
# `pages-build-deployment` workflow that GH spins up for "Deploy from a
# branch" mode):
#
# The auto-generated workflow wedged on 2026-05-23T14:10 — the latest
# `pages-build-deployment` run sat in `queued` state for 2 days while
# every subsequent push to main produced zero new deploy attempts. The
# live site began returning 404 once the cached deploy aged out.
# Cancelling the stuck run via `gh run cancel` returned "Cannot cancel
# a workflow run that is completed", suggesting the run is in a
# corrupted state on the GH side.
#
# Owning the deploy in an explicit workflow:
#   1. Removes the dependency on GH's auto-generated workflow.
#   2. Gives us version control over the deploy steps.
#   3. Plays nicely with the `Source: GitHub Actions` mode in
#      repo Settings → Pages, which is the modern recommended path
#      for static sites.
#
# REQUIRED ONE-TIME MANUAL STEP after this file lands:
#   Repo Settings → Pages → Build and deployment → Source →
#   GitHub Actions  (was: Deploy from a branch)
#   This switch is a Pages-config change that requires repo-admin
#   action; CI cannot do it automatically without elevated scopes.

on:
  push:
    branches: [main]
  # Manual trigger so the operator can re-deploy without a new commit
  # — useful when GH Pages or this workflow has been edited and the
  # site needs a refresh without a no-op commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` — let an in-flight deploy finish before
# starting a newer one. Partial deploys aren't safe (GH would serve
# half-uploaded artifacts); queue is the right primitive here.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Pages deploys are I/O dominated: upload artifact, GH-side
    # extraction, CDN propagation. 10 min is generous for a ~5MB site;
    # anything longer is a GH-side hang we want to fail-loud on.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (SHA-pinned; Dependabot updates)

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 (SHA-pinned; Dependabot updates)
        with:
          # Auto-enables Pages on the repo + switches the source to
          # "GitHub Actions" if it isn't already. Requires the workflow
          # to have `pages: write` permission (declared above). Without
          # this flag, the first run of this workflow fails with
          # "Get Pages site failed" until someone manually enables
          # Pages in repo Settings — which is exactly the breakage
          # this workflow exists to fix in the first place.
          enablement: true

      - name: Stage public files (exclude internal-only paths)
        # Build a staging directory containing only the files that should
        # be publicly served. We deploy from `_site/` rather than the repo
        # root so we can hold back paths whose presence on the live site
        # would falsify privacy claims or expose internal tooling.
        #
        # Specifically excluded:
        #   - tools/   Local-only OG-image renderer
        #              (tools/og-renderer/og-{en,ar}.html). The renderer
        #              loads fonts from fonts.googleapis.com when run
        #              locally to regenerate /og.png + /og-ar.png. The
        #              README.md and privacy.html both promise "no
        #              cross-origin font calls / no third-party scripts"
        #              — true for every served page once tools/ is held
        #              back from the deploy artifact. The renderer stays
        #              available locally (and in the git tree) for the
        #              only thing it's used for: producing the OG PNGs
        #              that ARE deployed.
        #   - .git/, .github/   Repo plumbing; never user-facing. Removes
        #              the deploy artifact's accidental /.github/... URL
        #              surface and shrinks the artifact size.
        #   - _site/, node_modules/   Defensive against re-runs / future
        #              local-build steps that might create those at root.
        #
        # No untrusted input is interpolated into this script — every
        # path is a literal string. The rsync exclusion patterns use
        # leading slashes so they match the source root only (not any
        # nested tools/ inside fonts/ or similar).
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/tools' \
            --exclude='/_site' \
            --exclude='/node_modules' \
            ./ _site/
          echo "Staged $(find _site -type f | wc -l | tr -d ' ') files."
          if [ -e _site/tools ]; then
            echo "::error::tools/ leaked into the deploy artifact — exclusion failed."
            exit 1
          fi
          echo "✓ tools/ correctly excluded from deploy artifact"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4 (SHA-pinned; Dependabot updates)
        with:
          # Deploy the staged directory, not the repo root. See the
          # "Stage public files" step above for the exclusion rationale.
          # The .nojekyll file is carried over by rsync from the repo
          # root, so Pages still skips Jekyll processing.
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 (SHA-pinned; Dependabot updates)
