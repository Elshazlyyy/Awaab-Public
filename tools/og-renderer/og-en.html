<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- This file is the local-only renderer for the deployed /og.png card.
       It is held back from the live site by .github/workflows/deploy-pages.yml
       and from crawlers by /robots.txt Disallow: /tools/. The noindex /
       nofollow meta below is the third layer: if the URL leaks (e.g. via
       a shared local-dev screenshot), search engines won't index it. -->
  <meta name="robots" content="noindex,nofollow">
  <title>Awaab OG — EN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #F4EFE3;
      color: #1A1916;
      padding: 72px 84px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      position: relative;
    }
    /* top — diamond mark + wordmark */
    .top {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .mark {
      width: 60px;
      height: 60px;
      display: block;
    }
    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 45.6px;
      color: #1A1916;
      letter-spacing: -0.015em;
      line-height: 1;
    }
    /* main proposition */
    .main {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 93.6px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #1A1916;
      max-width: 90%;
      white-space: pre-line;
    }
    /* bottom row */
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .promo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 19.2px;
      letter-spacing: 0.20em;
      color: #76592A;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .url {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 0.14em;
      color: #8A8576;
      white-space: nowrap;
    }
    /* corner diamond */
    .corner {
      position: absolute;
      top: 72px;
      right: 84px;
      width: 14.4px;
      height: 14.4px;
      background: #8A6E3A;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
  <div class="top">
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <line x1="18" y1="58" x2="82" y2="58" stroke="#1A1916" stroke-width="1.2" opacity="0.5"/>
      <path d="M 22 58 A 28 22 0 0 1 78 58" fill="none" stroke="#1A1916" stroke-width="1.4"/>
      <g transform="translate(50 38) rotate(45)">
        <rect x="-9" y="-9" width="18" height="18" fill="#8A6E3A"/>
      </g>
    </svg>
    <span class="wordmark">Awaab</span>
  </div>

  <div class="main">A quiet, offline companion
for the daily prayer.</div>

  <div class="bottom">
    <div class="promo">NO ACCOUNT &middot; NO ADS &middot; NO TRACKING</div>
    <div class="url">elshazlyyy.github.io</div>
  </div>

  <div class="corner"></div>
</body>
</html>
