<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Awaab OG — AR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #F4EFE3;
      color: #1A1916;
      padding: 72px 84px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: 'Cairo', sans-serif;
      direction: rtl;
      position: relative;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .mark {
      width: 60px;
      height: 60px;
      display: block;
    }
    .wordmark {
      font-family: 'Amiri Quran', serif;
      font-size: 45.6px;
      color: #1A1916;
      line-height: 1;
    }
    .main {
      font-family: 'Cairo', sans-serif;
      font-weight: 500;
      font-size: 78px;
      line-height: 1.18;
      letter-spacing: -0.005em;
      color: #1A1916;
      max-width: 92%;
      text-align: right;
    }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .promo {
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: #76592A;
      white-space: nowrap;
    }
    .url {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 0.14em;
      color: #8A8576;
      direction: ltr;
      white-space: nowrap;
    }
    .corner {
      position: absolute;
      top: 72px;
      left: 84px;
      width: 14.4px;
      height: 14.4px;
      background: #8A6E3A;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
  <div class="top">
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <line x1="18" y1="58" x2="82" y2="58" stroke="#1A1916" stroke-width="1.2" opacity="0.5"/>
      <path d="M 22 58 A 28 22 0 0 1 78 58" fill="none" stroke="#1A1916" stroke-width="1.4"/>
      <g transform="translate(50 38) rotate(45)">
        <rect x="-9" y="-9" width="18" height="18" fill="#8A6E3A"/>
      </g>
    </svg>
    <span class="wordmark">أوّاب</span>
  </div>

  <div class="main">رفيقٌ هادئٌ للصلاة اليوميّة،<br>يعمل دون اتّصال.</div>

  <div class="bottom">
    <div class="promo">بدون حساب &middot; بدون إعلانات &middot; بدون تتبّع</div>
    <div class="url">elshazlyyy.github.io</div>
  </div>

  <div class="corner"></div>
</body>
</html>
